name: radar

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Duas rodadas nunca salvam o histórico ao mesmo tempo.
concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e .

      - name: Procurar promoções
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m radar

      - name: Salvar histórico
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "histórico sem mudanças"
            exit 0
          fi
          git commit -m "data: atualiza histórico [skip ci]"
          git pull --rebase
          git push
